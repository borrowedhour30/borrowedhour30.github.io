<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A fictional machine that edits waiting out of your life. Three choices. What would you keep?"><title>THE EDITOR — The Borrowed Hour</title><style>
:root{color-scheme:dark;--bg:#101311;--panel:#171c19;--line:#3b4840;--ink:#e4e4d4;--muted:#a7b3a7;--green:#b4d2aa;--amber:#e1b77e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#28332b,var(--bg) 65%);color:var(--ink);font:15px/1.6 system-ui,sans-serif;min-height:100vh}main{max-width:810px;margin:auto;padding:24px 20px 40px}a{color:var(--green)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--amber);outline-offset:4px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font:11px/1.5 monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.top a{text-decoration:none}.sound{border:1px solid var(--line);background:transparent;padding:8px 12px;white-space:nowrap;color:var(--green)}.machine{margin-top:24px;border:1px solid #536459;background:var(--panel);box-shadow:0 18px 70px #0007,inset 0 0 0 5px #101611;padding:clamp(17px,4vw,36px)}.machinehead{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;font:11px/1.5 monospace;letter-spacing:.15em;color:var(--muted)}.lamp{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;box-shadow:0 0 12px var(--green);margin-right:8px}.screen{position:relative;overflow:hidden;background:#0c110e;border:1px solid var(--line);margin:22px 0 18px;min-height:180px;isolation:isolate}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 3px,#0003 3px 4px);z-index:2}.screen svg{display:block;width:100%;height:auto;max-height:245px}.screen .pulse{animation:pulse 3s ease-in-out infinite}.screen .sweep{animation:sweep 5s linear infinite}@keyframes pulse{50%{opacity:.35}}@keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(760px)}}.eyebrow{font:12px monospace;letter-spacing:.14em;color:var(--green);text-transform:uppercase}h1,h2{font:normal clamp(30px,6vw,55px)/1.03 Georgia,serif;letter-spacing:-.045em;margin:12px 0 16px}h2{font-size:clamp(28px,5vw,42px)}p{margin:10px 0;color:var(--muted);max-width:62ch}.lede{color:var(--ink);font-size:17px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.controls button,.primary{border:1px solid #77917c;background:#26382b;color:#edf2e5;text-align:left;padding:15px 16px;min-height:56px}.controls button:last-child{background:#222724;border-color:#56635a}.controls button:hover,.primary:hover{border-color:var(--green);background:#334739}.controls strong{display:block;font-size:16px}.controls small{display:block;color:#c1cbbd;margin-top:4px}.primary{margin-top:18px;min-width:180px;text-align:center}.readout{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:24px;border-top:1px solid var(--line);padding-top:12px;font:12px monospace;color:var(--green)}.meter{display:flex;gap:5px}.meter span{display:block;width:22px;height:6px;background:#37443b}.meter span.on{background:var(--green)}.resultgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.resultgrid div{border:1px solid var(--line);padding:14px}.resultgrid b{display:block;font:36px Georgia,serif;color:var(--ink)}.resultgrid span,.record small{color:var(--muted);font-size:12px}.record{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:10px}.record b{font:12px monospace;color:var(--amber);white-space:nowrap}.foot{font-size:12px;margin-top:16px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}.secondary{margin-top:12px;border:1px solid var(--line);background:transparent;padding:10px 16px}.fade{animation:appear .35s ease-out}@keyframes appear{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.controls{grid-template-columns:1fr}.machinehead{letter-spacing:.06em}.top{letter-spacing:.04em}.screen{min-height:0}.resultgrid b{font-size:28px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main><div class="top"><a href="index.html">← The Borrowed Hour</a><button class="sound" id="sound" aria-pressed="false">Sound: off</button></div><section class="machine" aria-label="The Editor interactive fiction"><div class="machinehead"><span><i class="lamp"></i> Bureau of Reclaimed Time</span><span>UNIT 003</span></div><div class="screen" id="screen" aria-hidden="true"></div><div id="content" aria-live="polite"></div><div class="readout"><span id="readout">RECOVERED / 00 MIN</span><div class="meter" id="meter" aria-hidden="true"><span></span><span></span><span></span></div></div></section><p class="foot">An interactive fiction by The Borrowed Hour. The machine, choices and recovered time are fictional. No response data is collected by this page. Sound is optional. You can leave at any time.</p></main><script>
const scenes=[{title:'The platform',time:12,body:'The next train arrives in twelve minutes. The station is nearly empty. Across the tracks, a maintenance worker is humming a tune you almost recognize.',keep:'Twelve minutes on the platform. You never quite place the tune.',cut:'You arrive as the train doors open. The platform passes without a pause.',visual:'train'},{title:'The kitchen',time:24,body:'Bread is baking. Twenty-four minutes remain. Rain runs down the window; the room is warm. There is nothing else you need to do.',keep:'Twenty-four minutes in the warm kitchen. The bread slowly turns golden.',cut:'The oven chimes immediately. The bread is ready, and the rain is still falling.',visual:'kitchen'},{title:'The unanswered message',time:19,body:'You have sent a message to an old friend. A reply will arrive in nineteen minutes. You could spend that interval with your own thoughts, or let the machine remove it.',keep:'Nineteen minutes with your thoughts. Then the reply arrives.',cut:'The reply appears at once. You read it without the intervening wait.',visual:'message'}];
let pos=-1,choices=[],ctx=null,hum=null,gain=null,soundOn=false,tones=[];const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');
function svg(kind){const base=`<svg viewBox="0 0 700 235" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#223129" stroke-width="1"/></pattern><radialGradient id="light"><stop stop-color="#a5c9a2" stop-opacity=".14"/><stop offset="1" stop-color="#0b100d" stop-opacity="0"/></radialGradient></defs><rect width="700" height="235" fill="url(#grid)"/><ellipse cx="350" cy="112" rx="250" ry="120" fill="url(#light)"/><g fill="none" stroke="#a6c3a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">`;const v={intro:`<circle cx="350" cy="114" r="83" opacity=".4"/><circle cx="350" cy="114" r="68"/><circle cx="350" cy="114" r="51" stroke-dasharray="2 9"/><path d="M350 63V114L389 139M344 114h12M350 108v12"/><path d="M150 114h101m198 0h101" opacity=".5"/><path class="pulse" d="M130 114h11m418 0h11" stroke="#e1b77e" stroke-width="4"/>`,train:`<path d="M80 190L310 122H390L620 190M150 210L325 122M550 210L375 122M0 193h700M85 35h530M110 35v140M590 35v140M190 35v85M510 35v85" opacity=".7"/><path d="M306 92h88v40h-88zM320 102h23v17h-23zM357 102h23v17h-23z"/><path d="M446 108v27m-9 18 9-18 9 18m-17-31 8-7 8 7"/><circle cx="446" cy="99" r="7"/><path class="pulse" d="M325 139h8m34 0h8" stroke="#e1b77e" stroke-width="4"/>`,kitchen:`<path d="M205 34h290v119H205zM350 34v119M205 94h290M160 181h380M190 181v33M510 181v33"/><path d="M270 180q-10-30 21-30h118q31 0 21 30z" stroke="#e1b77e"/><path d="M300 158l10 12m23-12 10 12m23-12 10 12" stroke="#e1b77e"/><g opacity=".5" class="pulse"><path d="M227 45l-9 25m40-12-12 28m50-36-12 30m89-30-11 29m53-20-14 32m50-40-11 27M230 107l-9 30m44-35-12 34m140-30-12 36m59-35-10 30"/></g>`,message:`<rect x="286" y="19" width="128" height="197" rx="12"/><path d="M305 38h90M305 194h90M300 70h87v34h-70l-9 9v-9h-8zM319 82h48m-48 10h34"/><path d="M319 126h81v30h-8v9l-9-9h-64z" opacity=".5"/><g class="pulse" fill="#e1b77e" stroke="none"><circle cx="342" cy="141" r="3"/><circle cx="359" cy="141" r="3"/><circle cx="376" cy="141" r="3"/></g>`,end:`<rect x="225" y="20" width="250" height="195" stroke-dasharray="5 3"/><path d="M255 48h190M255 78h190M255 108h190M255 138h190M255 168h190M255 194h110" opacity=".55"/><path d="M420 185l9 9 20-23" stroke="#e1b77e" stroke-width="3"/>`};return base+(v[kind]||v.intro)+`</g><path class="sweep" d="M0 0v235" stroke="#c7efc2" opacity=".17"/><g font-family="monospace" font-size="10" fill="#a6c3a3" opacity=".65"><text x="15" y="21">${kind==='intro'?'STANDBY':kind==='end'?'RECEIPT':'SOURCE / '+kind.toUpperCase()}</text><text x="15" y="220">CH. 003 / FICTIONAL SIMULATION</text></g></svg>`;}
function render(){let sum=choices.reduce((s,c,i)=>s+(c?scenes[i].time:0),0),kept=55-sum;$('readout').textContent=`RECOVERED / ${pad(sum)} MIN`;$('meter').innerHTML=scenes.map((_,i)=>`<span class="${i<choices.length?'on':''}"></span>`).join('');let html='';if(pos<0){$('screen').innerHTML=svg('intro');html=`<div class="eyebrow">Exhibit 003 / Interactive fiction</div><h1>The Editor.</h1><p class="lede">A machine has learned to remove waiting from your life.</p><p>It can cut three ordinary intervals from an imagined day and return those minutes to you. You decide which intervals to keep. The rest of your day stays unchanged.</p><button class="primary" id="begin">Authorize session →</button>`;}else if(pos<scenes.length){let s=scenes[pos];$('screen').innerHTML=svg(s.visual);html=`<div class="eyebrow">Interval ${pad(pos+1)} / ${s.time} minutes</div><h2>${s.title}</h2><p class="lede">${s.body}</p><div class="controls"><button id="cut"><strong>Cut the interval</strong><small>Recover ${s.time} minutes</small></button><button id="keep"><strong>Keep the interval</strong><small>Live these ${s.time} minutes</small></button></div>`;}else{$('screen').innerHTML=svg('end');html=`<div class="eyebrow">Session complete / Personal receipt</div><h2>Your edited day.</h2><div class="resultgrid"><div><span>TIME RECOVERED</span><b>${sum} min</b></div><div><span>INTERVALS KEPT</span><b>${kept} min</b></div></div>${scenes.map((s,i)=>`<div class="record"><div>${s.title}<br><small>${choices[i]?s.cut:s.keep}</small></div><b>${choices[i]?'CUT':'KEPT'}</b></div>`).join('')}<p class="lede">${sum===0?'You kept every interval.':sum===55?'You recovered every available minute.':'You kept some intervals and recovered others.'} What would you do with the minutes you recovered — or the ones you chose to keep?</p><button class="primary" id="copy">Copy my receipt</button> <button class="secondary" id="reset">New session</button><div class="notice" id="notice" role="status"></div>`;}$('content').innerHTML=`<div class="fade">${html}</div>`;if($('begin'))$('begin').onclick=()=>{pos=0;beep(330);render();focusHeading()};if($('cut'))$('cut').onclick=()=>choose(true);if($('keep'))$('keep').onclick=()=>choose(false);if($('reset'))$('reset').onclick=()=>{choices=[];pos=-1;render();focusHeading()};if($('copy'))$('copy').onclick=async()=>{let text=`THE EDITOR — My fictional time receipt\nRecovered: ${sum} min / Kept: ${kept} min\n${scenes.map((s,i)=>`${s.title}: ${choices[i]?'CUT':'KEPT'}`).join('\n')}\nhttps://borrowedhour30.github.io/editor.html`;try{await navigator.clipboard.writeText(text);$('notice').textContent='Receipt copied.'}catch(e){$('notice').textContent='Clipboard unavailable. You can select the receipt text manually.'}};}
function focusHeading(){let h=$('content').querySelector('h1,h2');h.tabIndex=-1;h.focus({preventScroll:true})}function choose(c){choices.push(c);pos++;beep(c?220:440);render();focusHeading()}
function beep(f){if(!soundOn||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.055,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.65);o.connect(g);g.connect(ctx.destination);o.start();o.stop(t+.7)}
$('sound').onclick=async()=>{try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.gain.value=0;gain.connect(ctx.destination);[55,82.4,110].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.16/(i+1);o.connect(g);g.connect(gain);o.start();tones.push(o)})}await ctx.resume();soundOn=!soundOn;gain.gain.setTargetAtTime(soundOn?.13:0,ctx.currentTime,.15);$('sound').textContent=soundOn?'Sound: on':'Sound: off';$('sound').setAttribute('aria-pressed',String(soundOn));if(soundOn)beep(330)}catch(e){$('sound').textContent='Sound unavailable';$('sound').disabled=true}};document.addEventListener('visibilitychange',()=>{if(ctx&&gain)gain.gain.setTargetAtTime(!document.hidden&&soundOn?.13:0,ctx.currentTime,.1)});render();
</script></body></html>
